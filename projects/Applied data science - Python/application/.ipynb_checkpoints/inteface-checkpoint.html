  <script>
    async function submitForm() {
      const fields = [
        'marital_status','application_mode','application_order','course','attendance',
        'prev_qual','prev_grade','admission_grade','age','gender','displaced','special_needs',
        'debtor','fees_up','scholarship','international',
        'mother_qual','father_qual','mother_occ','father_occ','nacionality',
        'cu1_credited','cu1_enrolled','cu1_evaluations','cu1_approved','cu1_grade','cu1_without_eval',
        'cu2_credited','cu2_enrolled','cu2_evaluations','cu2_approved','cu2_grade','cu2_without_eval',
        'unemployment','inflation','gdp'
      ];
      const columnMap = {
         'marital_status': 'Marital status',
        'application_mode': 'Application mode',
        'application_order': 'Application order',
        'course': 'Course',
        'attendance': 'Daytime/evening attendance',
        'prev_qual': 'Previous qualification',
        'prev_grade': 'Previous qualification (grade)',
        'admission_grade': 'Admission grade',
        'age': 'Age at enrollment',
        'gender': 'Gender',
        'displaced': 'Displaced',
        'special_needs': 'Educational special needs',
        'debtor': 'Debtor',
        'fees_up': 'Tuition fees up to date',
        'scholarship': 'Scholarship holder',
        'international': 'International',
        'cu1_credited': 'Curricular units 1st sem (credited)',
        'cu1_enrolled': 'Curricular units 1st sem (enrolled)',
        'cu1_evaluations': 'Curricular units 1st sem (evaluations)',
        'cu1_approved': 'Curricular units 1st sem (approved)',
        'cu1_grade': 'Curricular units 1st sem (grade)',
        'cu1_without_eval': 'Curricular units 1st sem (without evaluations)',
        'cu2_credited': 'Curricular units 2nd sem (credited)',
        'cu2_enrolled': 'Curricular units 2nd sem (enrolled)',
        'cu2_evaluations': 'Curricular units 2nd sem (evaluations)',
        'cu2_approved': 'Curricular units 2nd sem (approved)',
        'cu2_grade': 'Curricular units 2nd sem (grade)',
        'cu2_without_eval': 'Curricular units 2nd sem (without evaluations)',
        'unemployment': 'Unemployment rate',
        'inflation': 'Inflation rate',
        'gdp': 'GDP',
        'mother_qual': "Mother's qualification",
        'father_qual': "Father's qualification",
        'mother_occ': "Mother's occupation",
        'father_occ': "Father's occupation",
        'nacionality': "Nacionality"
      };
      const data = {};
      fields.forEach(id => {
        const colName = columnMap[id] || id;
        data[colName] = parseFloat(document.getElementById(id).value);
      });

      const res = await fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });

      const out = await res.json();
      document.getElementById("result").innerText =
        "Predicted Outcome: " + out.result;
      document.getElementById("percentage").innerText =
        "Probability: " + out.certainty;
    }
  </script>
